<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mango Quest</title>
<style>
:root {
  --bg: #eceef1; --surface: #fff; --border: #c3c8d0; --text: #1c1f24;
  --accent: #e8792b; --danger: #d1453b; --info: #2f6fd0;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #16181c; --surface: #272b32; --border: #454b55; --text: #e8eaed; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
  font-family: var(--font); color: var(--text);
  user-select: none; -webkit-user-select: none; }
#stage { height: 100vh; display: grid; place-items: center; padding: 16px; }
#card { position: relative; background: #fff; transform-origin: center center;
  box-shadow: 0 12px 32px rgba(0,0,0,.28); flex-shrink: 0; }
#paint { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#objects { position: absolute; inset: 0; }
.obj { position: absolute; }
.obj-text { white-space: pre-wrap; word-break: break-word; line-height: 1.25;
  pointer-events: none; }
.obj-button { display: grid; place-items: center; background: var(--surface);
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  overflow: hidden; font-size: 13px; color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.08); transition: transform .06s; }
.obj-button:active { transform: translateY(1px); }
.obj-button.is-canvas { padding: 0; background: #fff; }
.obj-button img { width: 100%; height: 100%; display: block; pointer-events: none; }
.obj-button span { padding: 0 8px; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; pointer-events: none; }
.obj-button.invisible { background: transparent; border: none; box-shadow: none;
  color: transparent; }
#msg { position: fixed; left: 50%; bottom: 16px;
  transform: translateX(-50%) translateY(8px); padding: 8px 16px; border-radius: 6px;
  font-size: 12px; opacity: 0; pointer-events: none; z-index: 200;
  transition: opacity .16s, transform .16s; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
#msg.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
#msg.error { background: var(--danger); color: #fff; }
#msg.info { background: var(--info); color: #fff; }
#dialog-backdrop { position: fixed; inset: 0; background: rgba(16,22,32,.32);
  display: none; align-items: flex-start; justify-content: center; z-index: 300; }
#dialog-backdrop.open { display: flex; }
#dialog { margin-top: 12vh; background: var(--surface); border-radius: 10px;
  box-shadow: 0 12px 32px rgba(0,0,0,.35); min-width: 340px; max-width: 90vw; }
#dialog-title { padding: 16px 16px 8px; font-size: 15px; font-weight: 600; }
#dialog-body { padding: 0 16px; line-height: 1.5; }
#dialog-body p { margin: 0 0 12px; }
#dialog-body input { width: 100%; height: 30px; padding: 0 8px; font: inherit;
  border: 1px solid var(--border); border-radius: 6px; background: var(--bg);
  color: var(--text); user-select: text; -webkit-user-select: text; }
#dialog-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 16px; }
.btn { height: 28px; padding: 0 14px; font: inherit; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--text); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
@keyframes fx-shake { 0%,100%{transform:translate(0,0) rotate(0)}
  10%{transform:translate(-6px,-4px) rotate(-1.5deg)} 20%{transform:translate(7px,3px) rotate(1deg)}
  30%{transform:translate(-5px,5px) rotate(-.8deg)} 40%{transform:translate(6px,-3px) rotate(1.2deg)}
  50%{transform:translate(-4px,4px) rotate(-1deg)} 60%{transform:translate(5px,-2px) rotate(.6deg)}
  70%{transform:translate(-3px,3px) rotate(-.5deg)} 80%{transform:translate(3px,-2px) rotate(.3deg)}
  90%{transform:translate(-2px,1px) rotate(-.2deg)} }
@keyframes fx-negative { 0%,49%{filter:invert(1) hue-rotate(180deg)} 50%,100%{filter:none} }
@keyframes fx-flash { 0%,100%{filter:none} 20%,60%{filter:brightness(3)} 40%,80%{filter:none} }
@keyframes fx-wobble { 0%,100%{transform:scaleX(1) scaleY(1)} 20%{transform:scaleX(1.04) scaleY(.96)}
  40%{transform:scaleX(.96) scaleY(1.04)} 60%{transform:scaleX(1.03) scaleY(.97)}
  80%{transform:scaleX(.98) scaleY(1.02)} }
.fx-shake { animation: fx-shake .5s ease-in-out; }
.fx-negative { animation: fx-negative .6s steps(1); }
.fx-flash { animation: fx-flash .5s ease-in-out; }
.fx-wobble { animation: fx-wobble .6s ease-in-out; }
</style>

<script>
/* ---------------------------------------------------------------------------
   Lexer.

   The original web app tokenised with a hand-rolled loop inside its interpreter
   and threw the positions away, so a malformed script failed silently at run
   time. Every token here carries a line and column, which is what lets the
   parser report errors the editor can point at.

   The language is line-oriented: newlines are significant and are emitted as
   tokens rather than skipped.
   --------------------------------------------------------------------------- */

const T = {
  WORD: 'word',       // bare identifier or command keyword
  NUMBER: 'number',
  STRING: 'string',
  OP: 'op',
  LPAREN: 'lparen',
  RPAREN: 'rparen',
  NEWLINE: 'newline',
  EOF: 'eof',
};

/** Multi-character operators must be tested before their single-char prefixes. */
const OPERATORS = ['>=', '<=', '==', '!=', '=', '>', '<', '+', '-', '*', '/', '&'];

class LexError extends Error {
  constructor(message, line, column) {
    super(message);
    this.name = 'LexError';
    this.line = line;
    this.column = column;
  }
}

/**
 * Turn source text into a flat token array terminated by EOF.
 * @param {string} src
 * @returns {{type: string, value: string, line: number, column: number}[]}
 */
function tokenize(src) {
  const tokens = [];
  let i = 0;
  let line = 1;
  let col = 1;
  const n = src.length;

  const push = (type, value, l, c) => tokens.push({ type, value, line: l, column: c });

  while (i < n) {
    const ch = src[i];

    // Newline — significant. \r\n collapses to one token.
    if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && src[i + 1] === '\n') i++;
      push(T.NEWLINE, '\n', line, col);
      i++;
      line++;
      col = 1;
      continue;
    }

    if (ch === ' ' || ch === '\t') {
      i++;
      col++;
      continue;
    }

    // Comment: `--` to end of line. Consumed entirely; the newline still emits.
    if (ch === '-' && src[i + 1] === '-') {
      while (i < n && src[i] !== '\n' && src[i] !== '\r') {
        i++;
        col++;
      }
      continue;
    }

    // String literal with backslash escapes.
    if (ch === '"') {
      const startLine = line;
      const startCol = col;
      i++;
      col++;
      let out = '';
      let closed = false;
      while (i < n) {
        const c = src[i];
        if (c === '\\' && i + 1 < n) {
          const esc = src[i + 1];
          out += esc === 'n' ? '\n' : esc === 't' ? '\t' : esc;
          i += 2;
          col += 2;
          continue;
        }
        if (c === '"') {
          i++;
          col++;
          closed = true;
          break;
        }
        if (c === '\n' || c === '\r') break; // unterminated — report at the quote
        out += c;
        i++;
        col++;
      }
      if (!closed) {
        throw new LexError('Unterminated string — missing closing quote', startLine, startCol);
      }
      push(T.STRING, out, startLine, startCol);
      continue;
    }

    // Number. A leading '-' is handled by the parser as unary minus so that
    // `score - 1` does not lex as `score` followed by `-1`.
    if (isDigit(ch) || (ch === '.' && isDigit(src[i + 1]))) {
      const startCol = col;
      let out = '';
      while (i < n && (isDigit(src[i]) || src[i] === '.')) {
        out += src[i];
        i++;
        col++;
      }
      // A trailing '%' makes the number a percentage, used by `move … by 50%`.
      if (src[i] === '%') {
        out += '%';
        i++;
        col++;
      }
      push(T.NUMBER, out, line, startCol);
      continue;
    }

    if (ch === '(') {
      push(T.LPAREN, '(', line, col);
      i++;
      col++;
      continue;
    }
    if (ch === ')') {
      push(T.RPAREN, ')', line, col);
      i++;
      col++;
      continue;
    }

    const op = OPERATORS.find((o) => src.startsWith(o, i));
    if (op) {
      push(T.OP, op, line, col);
      i += op.length;
      col += op.length;
      continue;
    }

    // Bare word: identifiers, command keywords, and card names alike. Card and
    // sound names in real stacks contain digits and underscores.
    if (isWordStart(ch)) {
      const startCol = col;
      let out = '';
      while (i < n && isWordPart(src[i])) {
        out += src[i];
        i++;
        col++;
      }
      push(T.WORD, out, line, startCol);
      continue;
    }

    throw new LexError(`Unexpected character '${ch}'`, line, col);
  }

  push(T.EOF, '', line, col);
  return tokens;
}

function isDigit(c) {
  return c >= '0' && c <= '9';
}

function isWordStart(c) {
  return /[A-Za-z_]/.test(c);
}

function isWordPart(c) {
  return /[A-Za-z0-9_.]/.test(c);
}

/* ---------------------------------------------------------------------------
   Parser — tokens to AST.

   The web version had no parser: `runScript()` walked raw lines and executed as
   it scanned, re-finding matching `end` keywords by counting depth on every
   branch. That made loops impractical and errors invisible until the moment a
   line ran.

   Producing a tree up front is what makes three things possible at once:
   `repeat` blocks, `else if` chains, and error reporting the editor can anchor
   to a line and column before the script is ever run.

   Grammar (statements are line-delimited):

     program    := statement*
     statement  := ifStmt | repeatStmt | assignment | command
                 | 'stop' | 'exit' 'repeat' | 'next' 'repeat'
     ifStmt     := 'if' cond NEWLINE block
                   ('else' 'if' cond NEWLINE block)*
                   ('else' NEWLINE block)? 'end'
     repeatStmt := 'repeat' (expr | 'while' cond | 'until' cond | 'forever')?
                   NEWLINE block 'end'
     assignment := WORD '=' expr

   Expression precedence, loosest first:

     compare  := concat (('>'|'<'|'>='|'<='|'=='|'!=') concat)?
     concat   := additive ('&' additive)*
     additive := term (('+'|'-') term)*
     term     := unary (('*'|'/') unary)*
     unary    := '-' unary | primary
     primary  := NUMBER | STRING | WORD | '(' compare ')'
   --------------------------------------------------------------------------- */



class ParseError extends Error {
  constructor(message, line, column) {
    super(message);
    this.name = 'ParseError';
    this.line = line;
    this.column = column;
  }
}

/** Directions accepted by `move`. */
const DIRECTIONS = new Set(['left', 'right', 'up', 'down']);

/** Words that terminate a block. Checked case-insensitively. */
const BLOCK_ENDERS = new Set(['end', 'else']);

/**
 * Parse script source into an AST.
 * @param {string} src
 * @returns {{type:'Program', body: object[]}}
 * @throws {ParseError|LexError}
 */
function parse(src) {
  const tokens = tokenize(src);
  const p = new Parser(tokens);
  return p.parseProgram();
}

/**
 * Parse and return errors instead of throwing — used by the editor to paint the
 * gutter on every keystroke without wrapping each call in try/catch.
 * @returns {{ast: object|null, error: {message,line,column}|null}}
 */
function tryParse(src) {
  try {
    return { ast: parse(src), error: null };
  } catch (e) {
    if (e instanceof ParseError || e instanceof LexError) {
      return { ast: null, error: { message: e.message, line: e.line, column: e.column } };
    }
    throw e;
  }
}

class Parser {
  constructor(tokens) {
    this.tokens = tokens;
    this.pos = 0;
  }

  // --- token helpers -------------------------------------------------------

  peek(offset = 0) {
    return this.tokens[Math.min(this.pos + offset, this.tokens.length - 1)];
  }

  next() {
    return this.tokens[this.pos++];
  }

  atEnd() {
    return this.peek().type === T.EOF;
  }

  /** True if the current token is the given bare word (case-insensitive). */
  isWord(word, offset = 0) {
    const t = this.peek(offset);
    return t.type === T.WORD && t.value.toLowerCase() === word;
  }

  /** Consume the current token if it is the given word. */
  acceptWord(word) {
    if (this.isWord(word)) {
      this.next();
      return true;
    }
    return false;
  }

  expectWord(word, what) {
    if (!this.acceptWord(word)) {
      const t = this.peek();
      throw new ParseError(
        `Expected '${word}'${what ? ` ${what}` : ''}, found ${describe(t)}`,
        t.line,
        t.column
      );
    }
  }

  /** Skip blank lines. */
  skipNewlines() {
    while (this.peek().type === T.NEWLINE) this.next();
  }

  /** Consume the end of a statement, erroring on trailing junk. */
  endStatement() {
    const t = this.peek();
    if (t.type === T.NEWLINE) {
      this.next();
      return;
    }
    if (t.type === T.EOF) return;
    throw new ParseError(`Unexpected ${describe(t)} at end of line`, t.line, t.column);
  }

  // --- statements ----------------------------------------------------------

  parseProgram() {
    const body = [];
    this.skipNewlines();
    while (!this.atEnd()) {
      const t = this.peek();
      if (t.type === T.WORD && BLOCK_ENDERS.has(t.value.toLowerCase())) {
        throw new ParseError(
          `'${t.value}' has no matching 'if' or 'repeat'`,
          t.line,
          t.column
        );
      }
      body.push(this.parseStatement());
      this.skipNewlines();
    }
    return { type: 'Program', body };
  }

  /** Parse statements until `end` or `else`, which the caller consumes. */
  parseBlock(openerLine, openerWord) {
    const body = [];
    this.skipNewlines();
    for (;;) {
      const t = this.peek();
      if (t.type === T.EOF) {
        throw new ParseError(
          `'${openerWord}' on line ${openerLine} is never closed — add 'end'`,
          t.line,
          t.column
        );
      }
      if (t.type === T.WORD && BLOCK_ENDERS.has(t.value.toLowerCase())) return body;
      body.push(this.parseStatement());
      this.skipNewlines();
    }
  }

  parseStatement() {
    const t = this.peek();
    if (t.type !== T.WORD) {
      throw new ParseError(`Expected a command, found ${describe(t)}`, t.line, t.column);
    }
    const word = t.value.toLowerCase();

    // Assignment is the only statement whose second token decides it.
    if (this.peek(1).type === T.OP && this.peek(1).value === '=') {
      return this.parseAssignment();
    }

    switch (word) {
      case 'if':
        return this.parseIf();
      case 'repeat':
        return this.parseRepeat();
      case 'stop':
        this.next();
        this.endStatement();
        return { type: 'Stop', line: t.line };
      case 'exit':
        this.next();
        this.expectWord('repeat', "after 'exit'");
        this.endStatement();
        return { type: 'ExitRepeat', line: t.line };
      case 'next':
        // `next repeat` is a loop control; `next` alone is not a command.
        if (this.isWord('repeat', 1)) {
          this.next();
          this.next();
          this.endStatement();
          return { type: 'NextRepeat', line: t.line };
        }
        throw new ParseError(
          "'next' must be followed by 'repeat' — did you mean 'go next'?",
          t.line,
          t.column
        );
      default:
        return this.parseCommand();
    }
  }

  parseAssignment() {
    const nameTok = this.next();
    if (!/^[A-Za-z_]\w*$/.test(nameTok.value)) {
      throw new ParseError(
        `'${nameTok.value}' is not a valid variable name`,
        nameTok.line,
        nameTok.column
      );
    }
    this.next(); // '='
    const value = this.parseExpression();
    this.endStatement();
    return { type: 'Assign', target: nameTok.value, value, line: nameTok.line };
  }

  parseIf() {
    const open = this.next(); // 'if'
    const branches = [];
    let cond = this.parseCondition();
    this.endStatement();
    let body = this.parseBlock(open.line, 'if');
    branches.push({ cond, body });

    let elseBody = null;
    for (;;) {
      if (this.isWord('else')) {
        this.next();
        if (this.isWord('if')) {
          this.next();
          cond = this.parseCondition();
          this.endStatement();
          body = this.parseBlock(open.line, 'if');
          branches.push({ cond, body });
          continue;
        }
        this.endStatement();
        elseBody = this.parseBlock(open.line, 'if');
        this.expectWord('end', "to close 'if'");
        this.endStatement();
        break;
      }
      this.expectWord('end', "to close 'if'");
      this.endStatement();
      break;
    }
    return { type: 'If', branches, elseBody, line: open.line };
  }

  parseRepeat() {
    const open = this.next(); // 'repeat'
    let kind = 'forever';
    let expr = null;

    if (this.peek().type === T.NEWLINE) {
      kind = 'forever';
    } else if (this.acceptWord('forever')) {
      kind = 'forever';
    } else if (this.acceptWord('while')) {
      kind = 'while';
      expr = this.parseCondition();
    } else if (this.acceptWord('until')) {
      kind = 'until';
      expr = this.parseCondition();
    } else {
      // `repeat 10` / `repeat 10 times`
      kind = 'count';
      expr = this.parseExpression();
      this.acceptWord('times');
    }
    this.endStatement();
    const body = this.parseBlock(open.line, 'repeat');
    this.expectWord('end', "to close 'repeat'");
    this.endStatement();
    return { type: 'Repeat', kind, expr, body, line: open.line };
  }

  // --- commands ------------------------------------------------------------

  parseCommand() {
    const t = this.next();
    const cmd = t.value.toLowerCase();
    const line = t.line;

    switch (cmd) {
      case 'go':
        return this.finish(this.parseGo(line));
      case 'play':
        this.expectWord('sound', "after 'play'");
        return this.finish({ type: 'PlaySound', name: this.parseName('a sound name'), line });
      case 'show':
        this.expectWord('button', "after 'show'");
        return this.finish({ type: 'ShowButton', id: this.parseName('a button id'), line });
      case 'hide':
        this.expectWord('button', "after 'hide'");
        return this.finish({ type: 'HideButton', id: this.parseName('a button id'), line });
      case 'trigger':
        this.expectWord('effect', "after 'trigger'");
        return this.finish({ type: 'TriggerEffect', name: this.parseName('an effect name'), line });
      case 'move':
        return this.finish(this.parseMove(line));
      case 'wait':
        return this.finish(this.parseWait(line));
      case 'ask':
        return this.finish({ type: 'Ask', prompt: this.parsePromptList(), line });
      case 'say':
        return this.finish({ type: 'Say', prompt: this.parsePromptList(), line });
      case 'yesno':
        return this.finish({ type: 'YesNo', prompt: this.parsePromptList(), line });
      default:
        throw new ParseError(`Unknown command '${t.value}'`, t.line, t.column);
    }
  }

  finish(node) {
    this.endStatement();
    return node;
  }

  parseGo(line) {
    const t = this.peek();
    if (t.type !== T.WORD) {
      throw new ParseError(
        `Expected 'next', 'prev', 'first', 'last', or 'card' after 'go', found ${describe(t)}`,
        t.line,
        t.column
      );
    }
    const w = t.value.toLowerCase();
    if (w === 'next' || w === 'first' || w === 'last') {
      this.next();
      return { type: 'Go', target: { kind: w }, line };
    }
    if (w === 'prev' || w === 'previous') {
      this.next();
      return { type: 'Go', target: { kind: 'prev' }, line };
    }
    if (w === 'card') {
      this.next();
      const nameTok = this.peek();
      if (nameTok.type === T.NUMBER) {
        this.next();
        return { type: 'Go', target: { kind: 'number', value: parseInt(nameTok.value, 10) }, line };
      }
      if (nameTok.type === T.WORD || nameTok.type === T.STRING) {
        this.next();
        return { type: 'Go', target: { kind: 'name', value: nameTok.value }, line };
      }
      throw new ParseError(
        `Expected a card name or number after 'go card', found ${describe(nameTok)}`,
        nameTok.line,
        nameTok.column
      );
    }
    throw new ParseError(
      `Unknown destination '${t.value}' — expected next, prev, first, last, or card`,
      t.line,
      t.column
    );
  }

  parseMove(line) {
    const id = this.parseName('a button id');
    const dirTok = this.peek();
    if (dirTok.type !== T.WORD || !DIRECTIONS.has(dirTok.value.toLowerCase())) {
      throw new ParseError(
        `Expected left, right, up, or down, found ${describe(dirTok)}`,
        dirTok.line,
        dirTok.column
      );
    }
    const direction = this.next().value.toLowerCase();
    this.expectWord('by', 'in a move command');

    // A percent literal changes the meaning of the amount, so note it before
    // the token is folded into an expression.
    const amountTok = this.peek();
    const isPercent = amountTok.type === T.NUMBER && amountTok.value.endsWith('%');
    const amount = this.parseExpression();

    this.expectWord('in', 'in a move command');
    const duration = this.parseExpression();
    this.acceptWord('seconds');
    this.acceptWord('second');

    return { type: 'Move', id, direction, amount, isPercent, duration, line };
  }

  parseWait(line) {
    if (this.acceptWord('until')) {
      this.expectWord('done', "after 'wait until'");
      return { type: 'WaitForSounds', line };
    }
    const seconds = this.parseExpression();
    this.acceptWord('seconds');
    this.acceptWord('second');
    return { type: 'Wait', seconds, line };
  }

  /**
   * A literal name argument: button ids, card names, sound names, effects.
   * These are not variable references — `play sound explosion` names the sound
   * "explosion" even if a variable of that name exists, matching the original.
   */
  parseName(what) {
    const t = this.peek();
    if (t.type === T.WORD || t.type === T.STRING || t.type === T.NUMBER) {
      this.next();
      return t.value;
    }
    throw new ParseError(`Expected ${what}, found ${describe(t)}`, t.line, t.column);
  }

  /**
   * Prompt arguments for say/ask/yesno. The original resolved each whitespace-
   * separated token and joined the results with spaces, so `say "Hi" name`
   * printed "Hi Alice". Parsing a list of expressions preserves that while also
   * allowing a single richer expression like `say "Score: " & score`.
   */
  parsePromptList() {
    const parts = [];
    while (this.peek().type !== T.NEWLINE && this.peek().type !== T.EOF) {
      parts.push(this.parseExpression());
    }
    if (parts.length === 0) {
      const t = this.peek();
      throw new ParseError('Expected a message to display', t.line, t.column);
    }
    return parts;
  }

  // --- conditions and expressions ------------------------------------------

  /**
   * Conditions add two phrase forms the expression grammar cannot express:
   * `<button> is [not] visible` and `card is [not] <name>`.
   */
  parseCondition() {
    // `card is [not] <name|number>`
    if (this.isWord('card') && this.isWord('is', 1)) {
      const line = this.peek().line;
      this.next();
      this.next();
      const negate = this.acceptWord('not');
      const t = this.peek();
      if (t.type === T.NUMBER) {
        this.next();
        return { type: 'CardIs', target: { kind: 'number', value: parseInt(t.value, 10) }, negate, line };
      }
      if (t.type === T.WORD || t.type === T.STRING) {
        this.next();
        return { type: 'CardIs', target: { kind: 'name', value: t.value }, negate, line };
      }
      throw new ParseError(`Expected a card name or number, found ${describe(t)}`, t.line, t.column);
    }

    // `<button> is [not] visible`
    if (this.peek().type === T.WORD && this.isWord('is', 1)) {
      const save = this.pos;
      const idTok = this.next();
      this.next(); // 'is'
      const negate = this.acceptWord('not');
      if (this.acceptWord('visible')) {
        return { type: 'IsVisible', id: idTok.value, negate, line: idTok.line };
      }
      this.pos = save; // not the visibility form — fall through to an expression
    }

    return this.parseExpression();
  }

  parseExpression() {
    return this.parseCompare();
  }

  parseCompare() {
    const left = this.parseConcat();
    const t = this.peek();
    if (t.type === T.OP && ['>', '<', '>=', '<=', '==', '!='].includes(t.value)) {
      this.next();
      const right = this.parseConcat();
      return { type: 'Compare', op: t.value, left, right, line: t.line };
    }
    // A single '=' in expression position is a common slip for '=='.
    if (t.type === T.OP && t.value === '=') {
      throw new ParseError("Use '==' to compare, '=' assigns", t.line, t.column);
    }
    return left;
  }

  parseConcat() {
    let left = this.parseAdditive();
    while (this.peek().type === T.OP && this.peek().value === '&') {
      const op = this.next();
      const right = this.parseAdditive();
      left = { type: 'Binary', op: '&', left, right, line: op.line };
    }
    return left;
  }

  parseAdditive() {
    let left = this.parseTerm();
    while (this.peek().type === T.OP && ['+', '-'].includes(this.peek().value)) {
      const op = this.next();
      const right = this.parseTerm();
      left = { type: 'Binary', op: op.value, left, right, line: op.line };
    }
    return left;
  }

  parseTerm() {
    let left = this.parseUnary();
    while (this.peek().type === T.OP && ['*', '/'].includes(this.peek().value)) {
      const op = this.next();
      const right = this.parseUnary();
      left = { type: 'Binary', op: op.value, left, right, line: op.line };
    }
    return left;
  }

  parseUnary() {
    const t = this.peek();
    if (t.type === T.OP && t.value === '-') {
      this.next();
      return { type: 'Unary', op: '-', operand: this.parseUnary(), line: t.line };
    }
    return this.parsePrimary();
  }

  parsePrimary() {
    const t = this.next();
    if (t.type === T.NUMBER) {
      const isPercent = t.value.endsWith('%');
      const raw = isPercent ? t.value.slice(0, -1) : t.value;
      return { type: 'Num', value: parseFloat(raw) || 0, percent: isPercent, line: t.line };
    }
    if (t.type === T.STRING) {
      return { type: 'Str', value: t.value, line: t.line };
    }
    if (t.type === T.WORD) {
      return { type: 'Var', name: t.value, line: t.line, column: t.column };
    }
    if (t.type === T.LPAREN) {
      const inner = this.parseExpression();
      const close = this.peek();
      if (close.type !== T.RPAREN) {
        throw new ParseError(`Expected ')', found ${describe(close)}`, close.line, close.column);
      }
      this.next();
      return inner;
    }
    throw new ParseError(`Expected a value, found ${describe(t)}`, t.line, t.column);
  }
}

function describe(t) {
  switch (t.type) {
    case T.EOF:
      return 'end of script';
    case T.NEWLINE:
      return 'end of line';
    case T.STRING:
      return `text "${t.value}"`;
    default:
      return `'${t.value}'`;
  }
}

/* ---------------------------------------------------------------------------
   Interpreter.

   Walks the AST produced by parser.js. Every side effect goes through the
   `host` object rather than the DOM, which is what lets one engine drive both
   the in-app play window and the standalone HTML export. The web version had
   two hand-maintained copies of this logic that had already drifted apart.

   Host interface (all may return promises):

     goCard(target)                  target = {kind:'next'|'prev'|'first'|'last'
                                              |'name'|'number', value?}
     playSound(name)                 resolves when the sound finishes
     waitForSounds()                 resolves when all in-flight sounds finish
     showButton(id) / hideButton(id)
     isButtonVisible(id) -> boolean
     moveButton(id, dir, amount, isPercent, seconds)
     triggerEffect(name)
     ask(prompt) -> string
     say(prompt)
     yesno(prompt) -> 1 | 0
     getText(name) -> string | null  null when no such text object
     setText(name, value) -> boolean true if a text object was updated
     currentCardName() -> string
     currentCardNumber() -> number   1-based
     reportError(message, line)
   --------------------------------------------------------------------------- */



/** Guards against runaway loops. Real loops exist now, so this is generous. */
const DEFAULT_STEP_LIMIT = 200000;

/** How many statements to run before yielding to the event loop. */
const YIELD_INTERVAL = 2000;

/** Signals propagated up through block execution. */
const SIG = { NONE: 0, STOP: 1, EXIT: 2, NEXT: 3, HALT: 4 };

class RuntimeError extends Error {
  constructor(message, line) {
    super(message);
    this.name = 'RuntimeError';
    this.line = line;
  }
}

class Interpreter {
  /**
   * @param {object} host    effect surface, see module docs
   * @param {object} globals shared variable bag, persists across scripts in a
   *                         play session (the web version reset it per session)
   */
  constructor(host, globals = {}) {
    this.host = host;
    this.globals = globals;
    this.stepLimit = DEFAULT_STEP_LIMIT;
    this.cancelled = false;
  }

  /** Stop a running script, e.g. when the user leaves play mode. */
  cancel() {
    this.cancelled = true;
  }

  /**
   * Parse and run a script.
   * @param {string} src
   * @param {string|null} selfId  button id that `this` refers to
   */
  async run(src, selfId = null) {
    if (!src || !src.trim()) return;
    let ast;
    try {
      ast = parse(src);
    } catch (e) {
      this.host.reportError(`Line ${e.line}: ${e.message}`, e.line);
      return;
    }

    this.selfId = selfId;
    this.steps = 0;
    this.cancelled = false;

    try {
      await this.execBlock(ast.body);
    } catch (e) {
      if (e instanceof RuntimeError) {
        this.host.reportError(
          e.line ? `Line ${e.line}: ${e.message}` : e.message,
          e.line
        );
        return;
      }
      throw e;
    }
  }

  // --- statement execution -------------------------------------------------

  async execBlock(stmts) {
    for (const stmt of stmts) {
      const sig = await this.execStatement(stmt);
      if (sig !== SIG.NONE) return sig;
    }
    return SIG.NONE;
  }

  async execStatement(node) {
    if (this.cancelled) return SIG.HALT;

    // Budget check, plus a periodic yield so a long loop keeps the UI alive.
    if (++this.steps > this.stepLimit) {
      throw new RuntimeError(
        `Script exceeded ${this.stepLimit} steps — check for a loop that never ends`,
        node.line
      );
    }
    if (this.steps % YIELD_INTERVAL === 0) {
      await new Promise((r) => setTimeout(r, 0));
      if (this.cancelled) return SIG.HALT;
    }

    switch (node.type) {
      case 'Assign': {
        const value = this.evaluate(node.value);
        // A text object of the same name takes precedence, matching the web
        // version: `text_1 = "hi"` retargets the on-card object, not a variable.
        if (!this.host.setText(node.target, stringify(value))) {
          this.globals[node.target] = value;
        }
        return SIG.NONE;
      }

      case 'If': {
        for (const branch of node.branches) {
          if (truthy(this.evaluate(branch.cond))) {
            return this.execBlock(branch.body);
          }
        }
        if (node.elseBody) return this.execBlock(node.elseBody);
        return SIG.NONE;
      }

      case 'Repeat':
        return this.execRepeat(node);

      case 'Stop':
        return SIG.STOP;
      case 'ExitRepeat':
        return SIG.EXIT;
      case 'NextRepeat':
        return SIG.NEXT;

      case 'Go':
        await this.host.goCard(this.resolveCardTarget(node.target));
        // Navigation runs the destination card's script. Letting the current
        // script continue afterwards would interleave two cards' logic against
        // the same runtime state, so `go` ends the running script. This is a
        // deliberate departure from the web version, which left the old script
        // running against the newly rendered card.
        return SIG.HALT;

      case 'PlaySound':
        await this.host.playSound(this.resolveName(node.name));
        return SIG.NONE;

      case 'WaitForSounds':
        await this.host.waitForSounds();
        return SIG.NONE;

      case 'Wait': {
        const secs = toNumber(this.evaluate(node.seconds));
        if (secs > 0) await sleep(secs * 1000, () => this.cancelled);
        return SIG.NONE;
      }

      case 'ShowButton':
        await this.host.showButton(this.resolveName(node.id));
        return SIG.NONE;
      case 'HideButton':
        await this.host.hideButton(this.resolveName(node.id));
        return SIG.NONE;

      case 'TriggerEffect':
        await this.host.triggerEffect(this.resolveName(node.name));
        return SIG.NONE;

      case 'Move': {
        const amount = toNumber(this.evaluate(node.amount));
        const seconds = toNumber(this.evaluate(node.duration));
        await this.host.moveButton(
          this.resolveName(node.id),
          node.direction,
          amount,
          node.isPercent,
          seconds
        );
        return SIG.NONE;
      }

      case 'Ask':
        this.globals.answer = await this.host.ask(this.buildPrompt(node.prompt));
        return SIG.NONE;

      case 'Say':
        await this.host.say(this.buildPrompt(node.prompt));
        return SIG.NONE;

      case 'YesNo':
        this.globals.answer = await this.host.yesno(this.buildPrompt(node.prompt));
        return SIG.NONE;

      default:
        throw new RuntimeError(`Cannot execute ${node.type}`, node.line);
    }
  }

  async execRepeat(node) {
    let iterations = 0;
    let limit = Infinity;

    if (node.kind === 'count') {
      limit = Math.floor(toNumber(this.evaluate(node.expr)));
      if (!(limit > 0)) return SIG.NONE;
    }

    for (;;) {
      if (this.cancelled) return SIG.HALT;
      if (node.kind === 'count' && iterations >= limit) break;
      if (node.kind === 'while' && !truthy(this.evaluate(node.expr))) break;
      if (node.kind === 'until' && truthy(this.evaluate(node.expr))) break;

      const sig = await this.execBlock(node.body);
      if (sig === SIG.EXIT) break;
      if (sig === SIG.STOP || sig === SIG.HALT) return sig;
      // SIG.NEXT falls through to the next iteration.

      iterations++;
    }
    return SIG.NONE;
  }

  // --- expression evaluation -----------------------------------------------

  evaluate(node) {
    switch (node.type) {
      case 'Num':
        return node.value;
      case 'Str':
        return node.value;

      case 'Var':
        return this.lookup(node.name);

      case 'Unary':
        return -toNumber(this.evaluate(node.operand));

      case 'Binary': {
        const a = this.evaluate(node.left);
        const b = this.evaluate(node.right);
        switch (node.op) {
          case '&':
            return stringify(a) + stringify(b);
          case '+':
            // '+' concatenates when either side is text, matching the web
            // version and JavaScript's own behaviour.
            return typeof a === 'string' || typeof b === 'string'
              ? stringify(a) + stringify(b)
              : a + b;
          case '-':
            return toNumber(a) - toNumber(b);
          case '*':
            return toNumber(a) * toNumber(b);
          case '/': {
            const d = toNumber(b);
            return d === 0 ? 0 : toNumber(a) / d;
          }
          default:
            throw new RuntimeError(`Unknown operator '${node.op}'`, node.line);
        }
      }

      case 'Compare': {
        const a = this.evaluate(node.left);
        const b = this.evaluate(node.right);
        const op = node.op;
        if (op === '==' || op === '!=') {
          // Comparing a number against text is a mistake worth surfacing
          // rather than silently answering false.
          if (typeof a !== typeof b) {
            throw new RuntimeError(
              `Cannot compare ${typeof a} (${stringify(a)}) with ${typeof b} (${stringify(b)}) using ${op}`,
              node.line
            );
          }
          return (op === '==' ? a === b : a !== b) ? 1 : 0;
        }
        if (typeof a === 'string' || typeof b === 'string') {
          throw new RuntimeError(
            `Cannot use ${op} to compare text — use == or != instead`,
            node.line
          );
        }
        const x = toNumber(a);
        const y = toNumber(b);
        const r =
          op === '>' ? x > y : op === '<' ? x < y : op === '>=' ? x >= y : x <= y;
        return r ? 1 : 0;
      }

      case 'IsVisible': {
        const visible = this.host.isButtonVisible(this.resolveName(node.id));
        return (node.negate ? !visible : visible) ? 1 : 0;
      }

      case 'CardIs': {
        const t = node.target;
        const match =
          t.kind === 'number'
            ? this.host.currentCardNumber() === t.value
            : this.host.currentCardName() === t.value;
        return (node.negate ? !match : match) ? 1 : 0;
      }

      default:
        throw new RuntimeError(`Cannot evaluate ${node.type}`, node.line);
    }
  }

  /**
   * Resolve a bare word to a value. Resolution order matches the web version's
   * `resolveValue()`: text objects shadow variables, and an unknown word that
   * looks numeric becomes a number, otherwise 0.
   */
  lookup(name) {
    if (name.toLowerCase() === 'this' && this.selfId) return this.selfId;

    const text = this.host.getText(name);
    if (text !== null && text !== undefined) return text;

    if (Object.prototype.hasOwnProperty.call(this.globals, name)) {
      return this.globals[name];
    }
    const n = Number(name);
    return name !== '' && !Number.isNaN(n) ? n : 0;
  }

  /** Literal name arguments still honour `this`. */
  resolveName(name) {
    return String(name).toLowerCase() === 'this' && this.selfId ? this.selfId : name;
  }

  resolveCardTarget(target) {
    if (target.kind === 'name') return { kind: 'name', value: this.resolveName(target.value) };
    return target;
  }

  /** Join a prompt's expression list with spaces, as the web version did. */
  buildPrompt(parts) {
    return parts.map((p) => stringify(this.evaluate(p))).join(' ');
  }
}

// --- value helpers ---------------------------------------------------------

function stringify(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') {
    // Trim float noise so `0.1 + 0.2` displays as 0.3, not 0.30000000000000004.
    return Number.isInteger(v) ? String(v) : String(parseFloat(v.toFixed(10)));
  }
  return String(v);
}

function toNumber(v) {
  if (typeof v === 'number') return v;
  const n = Number(v);
  return Number.isNaN(n) ? 0 : n;
}

function truthy(v) {
  if (typeof v === 'number') return v !== 0;
  if (typeof v === 'string') return v !== '' && v !== '0';
  return Boolean(v);
}

/** Interruptible sleep so `wait` does not outlive play mode. */
function sleep(ms, isCancelled) {
  return new Promise((resolve) => {
    const step = 50;
    let elapsed = 0;
    const tick = () => {
      if (isCancelled() || elapsed >= ms) return resolve();
      elapsed += step;
      setTimeout(tick, Math.min(step, ms - elapsed + step));
    };
    tick();
  });
}



/* ---------------------------------------------------------------------------
   Sound.

   Two sources, resolved in this order so a stack can shadow a built-in name:
     1. custom sounds imported into the document (data URLs)
     2. the six synthesised effects, generated with the Web Audio API
     3. bundled sample files shipped with the app

   Every play returns a promise that settles when the sound finishes, which is
   what `wait until done` blocks on.
   --------------------------------------------------------------------------- */

/** Names generated procedurally — these always work, with no assets present. */
const SYNTH_SOUNDS = ['click', 'beep', 'chime', 'whoosh', 'drum', 'glass'];

/** Sample files bundled with the app, carried over from the web version. */
const BUNDLED_SOUNDS = [
  'beam_me_up_scotty', 'bubbling_potion', 'chicken', 'creaky_door_short',
  'demon_your_soul', 'door_creak', 'explosion', 'kid_laugh',
  'magical_disappearance', 'magical_energy_burst', 'monster_1',
];

const SYNTH_SET = new Set(SYNTH_SOUNDS);

class AudioEngine {
  /**
   * @param {object} customSounds  { name: { dataUrl } } from the document
   * @param {string} assetBase     URL prefix for bundled samples
   */
  constructor(customSounds = {}, assetBase = '/audio/') {
    this.customSounds = customSounds;
    this.assetBase = assetBase;
    this.ctx = null;
    this.pending = new Set();
    this.elements = new Set();
  }

  setCustomSounds(map) {
    this.customSounds = map || {};
  }

  context() {
    if (!this.ctx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      this.ctx = new Ctor();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }

  /** Resolves when every sound started so far has finished. */
  waitForAll() {
    return Promise.all([...this.pending]).then(() => {});
  }

  /** Silence everything — used when leaving play mode. */
  stopAll() {
    for (const el of this.elements) {
      try {
        el.pause();
        el.currentTime = 0;
      } catch {
        /* element already discarded */
      }
    }
    this.elements.clear();
    this.pending.clear();
  }

  /**
   * Play a sound by name.
   * @returns {Promise<void>} settles when playback ends
   */
  play(name) {
    const p = this._play(name);
    this.pending.add(p);
    p.finally(() => this.pending.delete(p));
    return p;
  }

  _play(name) {
    if (!name) return Promise.resolve();

    const custom = this.customSounds[name];
    if (custom && custom.dataUrl) return this.playUrl(custom.dataUrl);

    if (SYNTH_SET.has(name)) return this.playSynth(name);

    return this.playUrl(`${this.assetBase}${name}.mp3`);
  }

  /** Play an audio file. Failures resolve rather than reject so a missing
      sound never wedges a script waiting on `wait until done`. */
  playUrl(url) {
    return new Promise((resolve) => {
      let audio;
      try {
        audio = new Audio(url);
      } catch {
        resolve();
        return;
      }
      const done = () => {
        this.elements.delete(audio);
        resolve();
      };
      this.elements.add(audio);
      audio.addEventListener('ended', done, { once: true });
      audio.addEventListener('error', done, { once: true });
      audio.play().catch(done);
    });
  }

  /* The six synthesised sounds. Envelopes and frequencies are carried over
     from the web version so existing stacks sound the same. */
  playSynth(name) {
    return new Promise((resolve) => {
      let ctx;
      try {
        ctx = this.context();
      } catch {
        resolve();
        return;
      }
      const now = ctx.currentTime;
      const out = ctx.destination;

      const osc = (type, freq) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, now);
        o.connect(g);
        g.connect(out);
        return [o, g];
      };

      const noiseBuffer = (seconds) => {
        const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        return buf;
      };

      switch (name) {
        case 'click': {
          const [o, g] = osc('sine', 1200);
          o.frequency.exponentialRampToValueAtTime(400, now + 0.08);
          g.gain.setValueAtTime(0.3, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          o.start(now);
          o.stop(now + 0.1);
          o.onended = resolve;
          break;
        }
        case 'beep': {
          const [o, g] = osc('square', 880);
          g.gain.setValueAtTime(0.2, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          o.start(now);
          o.stop(now + 0.2);
          o.onended = resolve;
          break;
        }
        case 'chime': {
          // A rising four-note arpeggio; resolve once the last note ends.
          let remaining = 4;
          const oneDone = () => {
            if (--remaining === 0) resolve();
          };
          [523, 659, 784, 1047].forEach((freq, i) => {
            const t = now + i * 0.15;
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.value = freq;
            o.connect(g);
            g.connect(out);
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.25, t + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
            o.start(t);
            o.stop(t + 0.7);
            o.onended = oneDone;
          });
          break;
        }
        case 'whoosh': {
          const src = ctx.createBufferSource();
          const filter = ctx.createBiquadFilter();
          const g = ctx.createGain();
          src.buffer = noiseBuffer(0.3);
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(4000, now);
          filter.frequency.exponentialRampToValueAtTime(200, now + 0.3);
          g.gain.setValueAtTime(0.4, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          src.connect(filter);
          filter.connect(g);
          g.connect(out);
          src.start(now);
          src.stop(now + 0.35);
          src.onended = resolve;
          break;
        }
        case 'drum': {
          // Noise burst plus a pitched-down thump, both must finish.
          let remaining = 2;
          const oneDone = () => {
            if (--remaining === 0) resolve();
          };
          const src = ctx.createBufferSource();
          const gN = ctx.createGain();
          src.buffer = noiseBuffer(0.2);
          gN.gain.setValueAtTime(0.8, now);
          gN.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          src.connect(gN);
          gN.connect(out);

          const [o, gO] = osc('sine', 150);
          o.frequency.exponentialRampToValueAtTime(50, now + 0.1);
          gO.gain.setValueAtTime(0.8, now);
          gO.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

          src.start(now);
          src.stop(now + 0.2);
          o.start(now);
          o.stop(now + 0.15);
          src.onended = oneDone;
          o.onended = oneDone;
          break;
        }
        case 'glass': {
          const [o, g] = osc('sine', 2000);
          g.gain.setValueAtTime(0.3, now);
          g.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
          o.start(now);
          o.stop(now + 1.3);
          o.onended = resolve;
          break;
        }
        default:
          resolve();
      }
    });
  }
}

/* ---------------------------------------------------------------------------
   Card effects. Each applies a CSS animation class to the card container and
   removes it when the animation ends, so effects can be retriggered.
   Keyframes live in styles/effects.css and are inlined into HTML exports.
   --------------------------------------------------------------------------- */

const EFFECTS = ['shake', 'flash', 'wobble', 'negative'];

const CLASS = {
  shake: 'fx-shake',
  flash: 'fx-flash',
  wobble: 'fx-wobble',
  negative: 'fx-negative',
};

/**
 * Play a named effect on an element.
 * @returns {Promise<void>} resolves when the animation finishes
 */
function triggerEffect(el, name) {
  const cls = CLASS[name];
  if (!el || !cls) return Promise.resolve();

  // Removing and reflowing restarts the animation if it is already running.
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);

  return new Promise((resolve) => {
    const done = () => {
      el.classList.remove(cls);
      resolve();
    };
    el.addEventListener('animationend', done, { once: true });
    // Fallback in case the animation never fires (element hidden, etc).
    setTimeout(done, 1200);
  });
}


/* --- exported player --- */
(function () {
  var CARD_W = 1063, CARD_H = 797;
  var data = JSON.parse(document.getElementById('stack-data').textContent);

  var cardEl = document.getElementById('card');
  var canvas = document.getElementById('paint');
  var objectsEl = document.getElementById('objects');
  var ctx = canvas.getContext('2d');

  cardEl.style.width = CARD_W + 'px';
  cardEl.style.height = CARD_H + 'px';

  function fit() {
    var s = Math.min((innerWidth - 32) / CARD_W, (innerHeight - 32) / CARD_H);
    cardEl.style.transform = 'scale(' + Math.max(0.1, s) + ')';
  }
  addEventListener('resize', fit);
  fit();

  function Player() {
    this.index = 0;
    this.buttons = new Map();
    this.texts = new Map();
    // Bundled samples are not inlined, so only custom sounds resolve to audio.
    this.audio = new AudioEngine(data.customSounds || {}, '');
    this.globals = Object.assign({}, data.variables, { answer: '' });
    this.interp = new Interpreter(this, this.globals);
  }

  Player.prototype.show = function (i) {
    var self = this;
    var card = data.cards[i];
    if (!card) return Promise.resolve();
    self.index = i;
    self.interp.cancel();

    return new Promise(function (resolve) {
      ctx.clearRect(0, 0, CARD_W, CARD_H);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, CARD_W, CARD_H);
      if (!card.imageData) return resolve();
      var img = new Image();
      img.onload = function () { ctx.drawImage(img, 0, 0, CARD_W, CARD_H); resolve(); };
      img.onerror = function () { resolve(); };
      img.src = card.imageData;
    }).then(function () {
      self.render(card);
      self.interp.cancelled = false;
      if (card.script && card.script.trim()) return self.interp.run(card.script, null);
    });
  };

  Player.prototype.render = function (card) {
    var self = this;
    objectsEl.innerHTML = '';
    self.buttons.clear();
    self.texts.clear();

    (card.textObjects || []).forEach(function (t) {
      var el = document.createElement('div');
      el.className = 'obj obj-text';
      el.style.cssText = 'left:' + t.x + 'px;top:' + t.y + 'px;width:' + t.w +
        'px;height:' + t.h + 'px;font-family:' + t.fontFamily +
        ';font-size:' + t.fontSize + 'px;color:' + t.color;
      el.textContent = t.content;
      objectsEl.appendChild(el);
      self.texts.set(t.id, el);
    });

    (card.buttons || []).forEach(function (b) {
      var el = document.createElement('div');
      el.className = 'obj obj-button' + (b.invisible ? ' invisible' : '') +
        (b.isCanvas ? ' is-canvas' : '');
      el.style.cssText = 'left:' + b.x + 'px;top:' + b.y + 'px;width:' + b.w +
        'px;height:' + b.h + 'px';
      if (b.isCanvas && b.canvasData) {
        var img = document.createElement('img');
        img.src = b.canvasData;
        el.appendChild(img);
      } else if (!b.isCanvas) {
        var label = document.createElement('span');
        label.textContent = b.label;
        el.appendChild(label);
      }
      el.addEventListener('click', function () { self.activate(b); });
      objectsEl.appendChild(el);
      self.buttons.set(b.nameId, { el: el, visible: true });
    });
  };

  Player.prototype.activate = function (b) {
    var self = this;
    if (b.effect) triggerEffect(cardEl, b.effect);
    if (b.script && b.script.trim()) {
      self.interp.cancelled = false;
      return self.interp.run(b.script, b.nameId);
    }
    if (b.sound) self.audio.play(b.sound);
    if (b.goto > 0 && b.goto <= data.cards.length) return self.show(b.goto - 1);
  };

  /* --- interpreter host --- */

  Player.prototype.goCard = function (t) {
    var n;
    if (t.kind === 'next') n = Math.min(this.index + 1, data.cards.length - 1);
    else if (t.kind === 'prev') n = Math.max(this.index - 1, 0);
    else if (t.kind === 'first') n = 0;
    else if (t.kind === 'last') n = data.cards.length - 1;
    else if (t.kind === 'number') n = t.value - 1;
    else {
      n = data.cards.findIndex(function (c) { return c.name === t.value; });
      if (n < 0) { var p = parseInt(t.value, 10); n = isNaN(p) ? -1 : p - 1; }
    }
    if (n < 0 || n >= data.cards.length) { this.reportError("No card '" + t.value + "'"); return; }
    return this.show(n);
  };
  Player.prototype.playSound = function (n) { return this.audio.play(n); };
  Player.prototype.waitForSounds = function () { return this.audio.waitForAll(); };
  Player.prototype.showButton = function (id) {
    var s = this.buttons.get(id);
    if (!s) return this.reportError("No button '" + id + "'");
    s.visible = true; s.el.style.visibility = 'visible'; s.el.style.pointerEvents = 'auto';
  };
  Player.prototype.hideButton = function (id) {
    var s = this.buttons.get(id);
    if (!s) return this.reportError("No button '" + id + "'");
    s.visible = false; s.el.style.visibility = 'hidden'; s.el.style.pointerEvents = 'none';
  };
  Player.prototype.isButtonVisible = function (id) {
    var s = this.buttons.get(id); return s ? s.visible : false;
  };
  Player.prototype.moveButton = function (id, dir, amount, isPercent, secs) {
    var s = this.buttons.get(id);
    if (!s) { this.reportError("No button '" + id + "'"); return Promise.resolve(); }
    var el = s.el;
    var base = (dir === 'left' || dir === 'right') ? el.offsetWidth : el.offsetHeight;
    var d = isPercent ? (amount / 100) * base : amount;
    var dx = dir === 'left' ? -d : dir === 'right' ? d : 0;
    var dy = dir === 'up' ? -d : dir === 'down' ? d : 0;
    var sl = parseFloat(el.style.left) || 0, st = parseFloat(el.style.top) || 0;
    var ms = Math.max(0, secs) * 1000;
    if (ms <= 0) { el.style.left = (sl + dx) + 'px'; el.style.top = (st + dy) + 'px'; return Promise.resolve(); }
    return new Promise(function (resolve) {
      var t0 = performance.now();
      function step(now) {
        var t = Math.min((now - t0) / ms, 1);
        var e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        el.style.left = (sl + dx * e) + 'px';
        el.style.top = (st + dy * e) + 'px';
        if (t < 1) requestAnimationFrame(step); else resolve();
      }
      requestAnimationFrame(step);
    });
  };
  Player.prototype.triggerEffect = function (n) { return triggerEffect(cardEl, n); };
  Player.prototype.getText = function (n) {
    var el = this.texts.get(n); return el ? el.textContent : null;
  };
  Player.prototype.setText = function (n, v) {
    var el = this.texts.get(n); if (!el) return false; el.textContent = v; return true;
  };
  Player.prototype.currentCardName = function () {
    return (data.cards[this.index] || {}).name || '';
  };
  Player.prototype.currentCardNumber = function () { return this.index + 1; };
  Player.prototype.reportError = function (m) { this.message(m, true); };

  Player.prototype.message = function (text, isErr) {
    var bar = document.getElementById('msg');
    bar.textContent = text;
    bar.className = 'visible ' + (isErr ? 'error' : 'info');
    clearTimeout(this._t);
    this._t = setTimeout(function () { bar.className = ''; }, 5000);
  };

  /* --- dialogs --- */

  function dialog(title, bodyBuilder, buttons) {
    var bd = document.getElementById('dialog-backdrop');
    document.getElementById('dialog-title').textContent = title;
    var body = document.getElementById('dialog-body');
    var foot = document.getElementById('dialog-foot');
    body.innerHTML = '';
    foot.innerHTML = '';
    var extra = bodyBuilder(body);
    buttons.forEach(function (b) {
      var el = document.createElement('button');
      el.className = 'btn' + (b.primary ? ' primary' : '');
      el.textContent = b.label;
      el.addEventListener('click', function () { bd.className = ''; b.action(); });
      foot.appendChild(el);
    });
    bd.className = 'open';
    setTimeout(function () {
      var f = extra || foot.querySelector('.primary');
      if (f) { f.focus(); if (f.select) f.select(); }
    }, 50);
  }

  Player.prototype.ask = function (prompt) {
    return new Promise(function (resolve) {
      var field;
      dialog('Input', function (body) {
        var p = document.createElement('p'); p.textContent = prompt;
        field = document.createElement('input'); field.type = 'text';
        body.appendChild(p); body.appendChild(field);
        field.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('dialog-backdrop').className = '';
            resolve(field.value);
          }
        });
        return field;
      }, [{ label: 'OK', primary: true, action: function () { resolve(field.value); } }]);
    });
  };

  Player.prototype.say = function (prompt) {
    return new Promise(function (resolve) {
      dialog('Message', function (body) {
        var p = document.createElement('p'); p.textContent = prompt; body.appendChild(p);
      }, [{ label: 'OK', primary: true, action: resolve }]);
    });
  };

  Player.prototype.yesno = function (prompt) {
    return new Promise(function (resolve) {
      dialog('Question', function (body) {
        var p = document.createElement('p'); p.textContent = prompt; body.appendChild(p);
      }, [
        { label: 'No', action: function () { resolve(0); } },
        { label: 'Yes', primary: true, action: function () { resolve(1); } }
      ]);
    });
  };

  new Player().show(0);
})();
