[package]
name = "hypermango"
version = "0.1.0"
description = "HyperMango — a HyperCard-style drawing and scripting studio"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
rand = "0.8"
open = "5"
urlencoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
